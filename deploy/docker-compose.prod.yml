# ─── vantai.tingting.vip (STAGING/demo server) stack ─────────────────────────
# Server-side home: /opt/vantai/deploy/ (this file + .env with real values).
# Deployed by `make demo` (root Makefile) — images ride the `:latest` channel.
name: vantai

services:
  postgres:
    # pgvector/pgvector:pg16 = upstream postgres:16 + the `vector` extension
    # preinstalled. Required for the FAQ fast lane (vector(1536) cosine index).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vantai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-VantaiDemo2026}
      POSTGRES_DB: vantai
    volumes:
      - /opt/vantai/data/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantai -d vantai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    expose:
      - "6379"
    volumes:
      - /opt/vantai/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/4rankng/transting-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://vantai:${DB_PASSWORD:-VantaiDemo2026}@postgres:5432/vantai?options=-c%20statement_timeout=60000
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=3090
      - UPLOAD_DIR=/app/backend/uploads
      - CORS_ORIGIN=https://vantai.tingting.vip
      # Stamped by `make demo` at cutover — /api/health reports it as buildHash
      # so a lagging staging/prod is diagnosable from one curl.
      - BUILD_HASH=${BUILD_HASH:-dev}
    expose:
      - "3090"
    ports:
      - "127.0.0.1:3090:3090"
    volumes:
      - /opt/vantai/data/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/4rankng/transting-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3000:80"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    profiles:
      - adminer
    depends_on:
      postgres:
        condition: service_healthy
