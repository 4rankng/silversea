# ── vantai.tingting.vip (demo server) — host nginx config ─────────────────────
# Live file: /etc/nginx/sites-available/vantai (symlinked from sites-enabled/vantai).
# SSL block + `listen 443` lines are managed by Certbot — do not hand-edit those.
#
# To update the server config:
#   1. Edit this file, then push it to the server:
#        scp deploy/nginx-host-vantai.conf root@vantai.tingting.vip:/etc/nginx/sites-available/vantai
#   2. Validate + reload:
#        ssh root@vantai.tingting.vip 'nginx -t && systemctl reload nginx'
#
# The `/socket.io/` block MUST sit above `location /` so the assistant
# (/agent namespace, path /socket.io) polling handshake + WebSocket upgrade
# reach the backend (3090) instead of the frontend SPA. Without it the
# public `/socket.io/` endpoint returns index.html and the assistant never
# connects.

server {
    server_name vantai.tingting.vip;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /uploads/ {
        alias /opt/vantai/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20m;
    }

    location /adminer/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # socket.io — assistant transport (/agent namespace, path /socket.io).
    # Sits above `location /` so the polling handshake + WebSocket upgrade
    # reach the backend (3090) instead of the frontend SPA. 300s keeps
    # long multi-tool MiniMax turns alive.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vantai.tingting.vip/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vantai.tingting.vip/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = vantai.tingting.vip) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vantai.tingting.vip;
    return 404; # managed by Certbot


}
