# ── silversea.tingting.vip (PROD server) — host nginx config ─────────────────
# Live file: /etc/nginx/sites-available/silversea (symlinked from sites-enabled).
#
# To update the server config:
#   1. Edit this file, then push it:
#        scp deploy/nginx-host-silversea.conf root@silversea.tingting.vip:/etc/nginx/sites-available/silversea
#   2. Validate + reload:
#        ssh root@silversea.tingting.vip 'nginx -t && systemctl reload nginx'
#
# Initial issuance flow (one-time, done by `make deploy-server-setup`):
#   1. A temporary port-80-only vhost (ACME webroot location) is pushed first.
#   2. certbot certonly --webroot -w /var/www/certbot -d silversea.tingting.vip
#   3. This full vhost is pushed; certbot renewals re-run the webroot challenge
#      against the same location and only need an nginx reload (deploy hook).

server {
    server_name silversea.tingting.vip;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # /uploads/ removed — all evidence served through authenticated /api/photos
    # (QA-125: public mount exposed protected trip photos and receipts).

    location /api/ {
        proxy_pass         http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20m;
    }

    # No public /adminer/ on prod: when the adminer compose profile is needed,
    # reach it through an SSH tunnel instead:
    #   ssh -N -L 8080:127.0.0.1:8080 root@silversea.tingting.vip
    #   -> http://127.0.0.1:8080

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate     /etc/letsencrypt/live/silversea.tingting.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silversea.tingting.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = silversea.tingting.vip) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name silversea.tingting.vip;
    return 404;
}
