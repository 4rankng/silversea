services:
  db:
    # pgvector/pgvector:pg16 = upstream postgres:16 + the `vector` extension
    # preinstalled. Required for the FAQ fast lane (vector(1536) cosine index).
    # Switched from postgres:16-alpine — the stock alpine image lacks the extension.
    image: pgvector/pgvector:pg16
    # Namespaced silversea-* so this stack runs alongside other projects
    # without Docker container-name collisions.
    container_name: ss-main-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: silversea
    ports:
      - "5442:5432"
    volumes:
      - ss-main-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ss-main-redis
    ports:
      - "6392:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    container_name: ss-main-adminer
    ports:
      - "8084:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ss-main-pgdata:
