<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/transting-favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/transting-favicon-16.png?v=5" />

    <!-- ─── PWA / Add to Home Screen ──────────────────────────────────────── -->
    <!-- Standalone display when launched from home screen (no browser chrome) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#005A2D" />
    <meta name="color-scheme" content="light" />

    <!-- iOS Safari: "Add to Home Screen" standalone mode.
         When Pete taps Share → Add to Home Screen and re-opens the icon,
         iOS reads these tags to launch full-screen without the Safari URL bar
         and bottom toolbar. iOS requires PNG for apple-touch-icon (AVIF
         is silently rejected → falls back to a screenshot of the page). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TransTing" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/transting-logo-180.png?v=4" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/transting-logo-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/transting-logo-512.png?v=4" />

    <!-- Typography — two self-hosted families only (no CDN):
         Be Vietnam Pro (Vietnamese-aware text/UI) + JetBrains Mono (numerics).
         Declared in /fonts/fonts.css. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>TransTing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
