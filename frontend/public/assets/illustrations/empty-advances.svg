<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="ea-env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="ea-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="ea-cash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="ea-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.10"/>
    </filter>
  </defs>
  <!-- Envelope body -->
  <rect x="44" y="80" width="152" height="100" rx="10" fill="url(#ea-env)" stroke="#A7F3D0" stroke-width="1.5" filter="url(#ea-shadow)"/>
  <!-- Envelope bottom fold lines -->
  <line x1="44" y1="130" x2="120" y2="100" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="196" y1="130" x2="120" y2="100" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Envelope flap (open) -->
  <path d="M44 80 L120 126 L196 80 Z" fill="url(#ea-flap)" stroke="#A7F3D0" stroke-width="1.2"/>
  <!-- Cash bill peeking out -->
  <rect x="80" y="42" width="80" height="52" rx="6" fill="url(#ea-cash)" filter="url(#ea-shadow)"/>
  <rect x="84" y="46" width="72" height="44" rx="4" fill="none" stroke="#6EE7B7" stroke-width="1" opacity="0.5"/>
  <!-- Bill detail lines -->
  <rect x="88" y="52" width="28" height="6" rx="3" fill="#ECFDF5" opacity="0.5"/>
  <rect x="124" y="52" width="24" height="6" rx="3" fill="#ECFDF5" opacity="0.3"/>
  <!-- Currency symbol on bill -->
  <text x="120" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" opacity="0.7">₫</text>
  <!-- Small bill corner curl -->
  <path d="M152 42 Q160 42 160 50" stroke="#6EE7B7" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Clock badge (pending advances) -->
  <circle cx="170" cy="72" r="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#ea-shadow)"/>
  <circle cx="170" cy="72" r="7" fill="none" stroke="#059669" stroke-width="1.5"/>
  <line x1="170" y1="68" x2="170" y2="72" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170" y1="72" x2="173" y2="74" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Zero indicator -->
  <rect x="80" y="144" width="80" height="18" rx="9" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="120" y="157" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#059669">Chưa có yêu cầu</text>
</svg>
