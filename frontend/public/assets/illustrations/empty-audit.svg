<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="eau-clipboard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="eau-clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="eau-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#09090B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Page shadow -->
  <rect x="78" y="38" width="90" height="130" rx="8" fill="#E5E7EB" transform="rotate(3 123 103)"/>
  <!-- Main clipboard -->
  <rect x="72" y="34" width="96" height="136" rx="8" fill="url(#eau-clipboard)" filter="url(#eau-shadow)"/>
  <!-- Clipboard top clip -->
  <rect x="100" y="26" width="40" height="20" rx="6" fill="url(#eau-clip)"/>
  <rect x="114" y="22" width="12" height="10" rx="3" fill="#047857"/>
  <!-- Clip ring -->
  <rect x="112" y="20" width="16" height="14" rx="5" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
  <!-- Header area -->
  <rect x="80" y="52" width="80" height="8" rx="4" fill="#F0FDF4"/>
  <rect x="80" y="65" width="56" height="6" rx="3" fill="#E5E7EB"/>
  <!-- Divider -->
  <line x1="80" y1="78" x2="160" y2="78" stroke="#F3F4F6" stroke-width="1.5"/>
  <!-- Empty log rows (dashed lines = no entries) -->
  <rect x="80" y="86" width="8" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="94" y="88" width="52" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="150" y="88" width="12" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="80" y="100" width="8" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="94" y="102" width="44" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="142" y="102" width="18" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="80" y="114" width="8" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="94" y="116" width="60" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="80" y="128" width="8" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="94" y="130" width="36" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="80" y="142" width="8" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="94" y="144" width="48" height="4" rx="2" fill="#F3F4F6"/>
  <!-- Magnifying glass overlay -->
  <circle cx="170" cy="68" r="20" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" filter="url(#eau-shadow)"/>
  <circle cx="168" cy="66" r="11" fill="none" stroke="#059669" stroke-width="2.5"/>
  <line x1="176" y1="74" x2="186" y2="84" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Inside magnifier: no results icon -->
  <line x1="163" y1="66" x2="173" y2="66" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="61" x2="168" y2="71" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round"/>
</svg>
