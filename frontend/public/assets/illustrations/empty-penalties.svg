<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="epl-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="epl-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="epl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#059669" flood-opacity="0.20"/>
    </filter>
    <filter id="epl-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#09090B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <!-- Subtle rays -->
  <g opacity="0.07" stroke="#059669" stroke-width="1.5">
    <line x1="120" y1="30" x2="120" y2="10"/>
    <line x1="148" y1="38" x2="162" y2="22"/>
    <line x1="92" y1="38" x2="78" y2="22"/>
    <line x1="162" y1="62" x2="182" y2="54"/>
    <line x1="78" y1="62" x2="58" y2="54"/>
  </g>
  <!-- Shield -->
  <path d="M120 30 L168 50 L168 98 Q168 138 120 162 Q72 138 72 98 L72 50 Z" fill="url(#epl-shield)" filter="url(#epl-glow)"/>
  <!-- Shield highlight -->
  <path d="M120 34 L164 53 L164 98 Q164 135 120 158" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.15"/>
  <!-- Inner shield -->
  <path d="M120 46 L152 60 L152 98 Q152 122 120 140 Q88 122 88 98 L88 60 Z" fill="url(#epl-inner)"/>
  <!-- Big check -->
  <polyline points="103,94 115,108 137,78" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floating x-marks (cancelled penalties) -->
  <g opacity="0.28">
    <g stroke="#E32434" stroke-width="1.8" stroke-linecap="round" transform="translate(46 80)">
      <line x1="-5" y1="-5" x2="5" y2="5"/>
      <line x1="5" y1="-5" x2="-5" y2="5"/>
    </g>
    <circle cx="46" cy="80" r="10" stroke="#E32434" stroke-width="1.2" fill="#FEF2F2" fill-opacity="0.5"/>
  </g>
  <g opacity="0.22">
    <g stroke="#E32434" stroke-width="1.6" stroke-linecap="round" transform="translate(194 110)">
      <line x1="-4" y1="-4" x2="4" y2="4"/>
      <line x1="4" y1="-4" x2="-4" y2="4"/>
    </g>
    <circle cx="194" cy="110" r="8" stroke="#E32434" stroke-width="1" fill="#FEF2F2" fill-opacity="0.4"/>
  </g>
  <!-- Star sparkle -->
  <g stroke="#059669" stroke-width="1.4" stroke-linecap="round" opacity="0.45" transform="translate(56 52)">
    <line x1="0" y1="-7" x2="0" y2="7"/>
    <line x1="-7" y1="0" x2="7" y2="0"/>
    <line x1="-5" y1="-5" x2="5" y2="5"/>
    <line x1="5" y1="-5" x2="-5" y2="5"/>
  </g>
  <g stroke="#059669" stroke-width="1" stroke-linecap="round" opacity="0.3" transform="translate(192 60)">
    <line x1="0" y1="-5" x2="0" y2="5"/>
    <line x1="-5" y1="0" x2="5" y2="0"/>
  </g>
</svg>
