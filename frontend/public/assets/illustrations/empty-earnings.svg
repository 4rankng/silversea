<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="ee-wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ee-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="ee-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <filter id="ee-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Open wallet body -->
  <rect x="52" y="68" width="136" height="96" rx="12" fill="url(#ee-wallet)" filter="url(#ee-shadow)"/>
  <!-- Wallet interior -->
  <rect x="60" y="88" width="120" height="68" rx="8" fill="url(#ee-inner)"/>
  <!-- Wallet flap (open) -->
  <path d="M52 80 Q52 68 64 68 L176 68 Q188 68 188 80" fill="url(#ee-wallet)" stroke="none"/>
  <path d="M52 80 Q52 68 64 68 L176 68 Q188 68 188 80" stroke="#047857" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Interior card slot -->
  <rect x="68" y="96" width="104" height="32" rx="6" fill="url(#ee-card)" stroke="#D1FAE5" stroke-width="1"/>
  <!-- Card chip placeholder -->
  <rect x="76" y="104" width="18" height="12" rx="3" fill="#E5E7EB"/>
  <!-- Card empty lines -->
  <rect x="102" y="105" width="56" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="102" y="115" width="40" height="4" rx="2" fill="#F3F4F6"/>
  <!-- No deductions message area -->
  <rect x="68" y="136" width="104" height="14" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="76" y="140" width="44" height="5" rx="2.5" fill="#6EE7B7" opacity="0.6"/>
  <rect x="126" y="140" width="28" height="5" rx="2.5" fill="#6EE7B7" opacity="0.35"/>
  <!-- Wallet clasp -->
  <circle cx="120" cy="68" r="8" fill="#047857" stroke="#059669" stroke-width="1"/>
  <circle cx="120" cy="68" r="4" fill="url(#ee-inner)" stroke="#A7F3D0" stroke-width="1"/>
  <!-- Floating coins (empty / faded) -->
  <circle cx="40" cy="80" r="12" fill="#FEF9C3" stroke="#D97706" stroke-width="1.2" opacity="0.7"/>
  <text x="40" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#D97706" opacity="0.7">₫</text>
  <circle cx="200" cy="118" r="9" fill="#FEF9C3" stroke="#D97706" stroke-width="1.2" opacity="0.5"/>
  <text x="200" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#D97706" opacity="0.5">₫</text>
  <!-- Zero badge -->
  <rect x="88" y="46" width="64" height="18" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="120" y="59" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#059669">0 khấu trừ</text>
</svg>
