<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="eu-avatar-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="eu-avatar-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="eu-avatar-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <filter id="eu-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#09090B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background avatar (right, grey) -->
  <circle cx="164" cy="80" r="30" fill="url(#eu-avatar-c)" filter="url(#eu-shadow)" opacity="0.7"/>
  <circle cx="164" cy="71" r="12" fill="#D1D5DB" opacity="0.8"/>
  <path d="M140 104 Q140 88 164 88 Q188 88 188 104" fill="#D1D5DB" opacity="0.8"/>
  <!-- Background avatar (left, grey) -->
  <circle cx="76" cy="80" r="30" fill="url(#eu-avatar-c)" filter="url(#eu-shadow)" opacity="0.7"/>
  <circle cx="76" cy="71" r="12" fill="#D1D5DB" opacity="0.8"/>
  <path d="M52 104 Q52 88 76 88 Q100 88 100 104" fill="#D1D5DB" opacity="0.8"/>
  <!-- Main center avatar (green) -->
  <circle cx="120" cy="76" r="38" fill="url(#eu-avatar-b)" stroke="#A7F3D0" stroke-width="1.5" filter="url(#eu-shadow)"/>
  <!-- Person silhouette -->
  <circle cx="120" cy="64" r="14" fill="url(#eu-avatar-a)"/>
  <path d="M90 100 Q90 80 120 80 Q150 80 150 100" fill="url(#eu-avatar-a)"/>
  <!-- Plus badge -->
  <circle cx="146" cy="46" r="14" fill="#059669" filter="url(#eu-shadow)"/>
  <line x1="146" y1="40" x2="146" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="46" x2="152" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dashed circles (empty slots) -->
  <circle cx="46" cy="140" r="14" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="4 3" fill="#F9FAFB"/>
  <text x="46" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#E4E4E7">+</text>
  <circle cx="82" cy="152" r="10" stroke="#E4E4E7" stroke-width="1.2" stroke-dasharray="3 2" fill="#F9FAFB"/>
  <circle cx="158" cy="152" r="10" stroke="#E4E4E7" stroke-width="1.2" stroke-dasharray="3 2" fill="#F9FAFB"/>
  <circle cx="194" cy="140" r="14" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="4 3" fill="#F9FAFB"/>
  <text x="194" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#E4E4E7">+</text>
  <!-- Label rows -->
  <rect x="96" y="122" width="48" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="104" y="132" width="32" height="5" rx="2.5" fill="#F0FDF4"/>
</svg>
