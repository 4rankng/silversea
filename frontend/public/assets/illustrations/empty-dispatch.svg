<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="ed-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="ed-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="ed-circle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="ed-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.14"/>
    </filter>
    <filter id="ed-card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#09090B" flood-opacity="0.07"/>
    </filter>
  </defs>
  <!-- Background cards (completed orders stacked) -->
  <rect x="60" y="72" width="132" height="88" rx="10" fill="#E5E7EB" transform="rotate(-4 126 116)" filter="url(#ed-card-shadow)"/>
  <rect x="60" y="72" width="132" height="88" rx="10" fill="#F3F4F6" transform="rotate(-1.5 126 116)"/>
  <rect x="60" y="72" width="132" height="88" rx="10" fill="url(#ed-card)" filter="url(#ed-card-shadow)"/>
  <!-- Card content lines (checked off) -->
  <line x1="78" y1="96" x2="168" y2="96" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="108" x2="152" y2="108" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="118" x2="144" y2="118" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="128" x2="136" y2="128" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Strikethrough for completed -->
  <line x1="78" y1="108" x2="152" y2="108" stroke="#059669" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="78" y1="118" x2="144" y2="118" stroke="#059669" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="78" y1="128" x2="136" y2="128" stroke="#059669" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <!-- Big check circle -->
  <circle cx="163" cy="71" r="26" fill="url(#ed-circle)" filter="url(#ed-drop)"/>
  <circle cx="163" cy="71" r="22" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Checkmark -->
  <polyline points="151,71 160,81 176,60" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Subtle sparkles -->
  <circle cx="54" cy="60" r="3" fill="#059669" opacity="0.18"/>
  <circle cx="198" cy="110" r="2" fill="#059669" opacity="0.22"/>
  <g stroke="#059669" stroke-width="1.6" stroke-linecap="round" opacity="0.35">
    <line x1="44" y1="98" x2="50" y2="104"/>
    <line x1="50" y1="98" x2="44" y2="104"/>
  </g>
  <g stroke="#059669" stroke-width="1.2" stroke-linecap="round" opacity="0.2">
    <line x1="208" y1="76" x2="213" y2="81"/>
    <line x1="213" y1="76" x2="208" y2="81"/>
  </g>
  <!-- Label tag on card -->
  <rect x="78" y="83" width="52" height="8" rx="4" fill="url(#ed-bg)"/>
  <rect x="134" y="83" width="26" height="8" rx="4" fill="#E5E7EB"/>
</svg>
