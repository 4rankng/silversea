<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="ef-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
    <linearGradient id="ef-truck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
    <linearGradient id="ef-cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="ef-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#09090B" flood-opacity="0.07"/>
    </filter>
  </defs>
  <!-- Ground / parking lot -->
  <rect x="0" y="148" width="240" height="52" fill="url(#ef-ground)"/>
  <line x1="0" y1="148" x2="240" y2="148" stroke="#E4E4E7" stroke-width="1.2"/>
  <!-- Parking lines -->
  <line x1="80" y1="148" x2="80" y2="200" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="160" y1="148" x2="160" y2="200" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Truck 1 (small, left) -->
  <rect x="18" y="110" width="52" height="38" rx="4" fill="url(#ef-truck)" stroke="#E4E4E7" stroke-width="1.2" filter="url(#ef-shadow)"/>
  <rect x="70" y="118" width="22" height="30" rx="3" fill="url(#ef-cab)"/>
  <rect x="73" y="121" width="14" height="10" rx="2" fill="#ECFDF5" stroke="#FFFFFF" stroke-width="0.8"/>
  <circle cx="30" cy="148" r="9" fill="#3F3F46"/>
  <circle cx="30" cy="148" r="4" fill="#71717A"/>
  <circle cx="30" cy="148" r="1.8" fill="#A1A1AA"/>
  <circle cx="60" cy="148" r="9" fill="#3F3F46"/>
  <circle cx="60" cy="148" r="4" fill="#71717A"/>
  <circle cx="60" cy="148" r="1.8" fill="#A1A1AA"/>
  <circle cx="82" cy="148" r="9" fill="#3F3F46"/>
  <circle cx="82" cy="148" r="4" fill="#71717A"/>
  <circle cx="82" cy="148" r="1.8" fill="#A1A1AA"/>
  <!-- Truck 2 (right, faded/parked) -->
  <rect x="98" y="110" width="52" height="38" rx="4" fill="url(#ef-truck)" stroke="#E4E4E7" stroke-width="1.2" filter="url(#ef-shadow)" opacity="0.75"/>
  <rect x="150" y="118" width="22" height="30" rx="3" fill="#9CA3AF" opacity="0.7"/>
  <rect x="153" y="121" width="14" height="10" rx="2" fill="#F3F4F6" opacity="0.7"/>
  <circle cx="110" cy="148" r="9" fill="#6B7280" opacity="0.6"/>
  <circle cx="110" cy="148" r="4" fill="#9CA3AF" opacity="0.6"/>
  <circle cx="140" cy="148" r="9" fill="#6B7280" opacity="0.6"/>
  <circle cx="140" cy="148" r="4" fill="#9CA3AF" opacity="0.6"/>
  <circle cx="162" cy="148" r="9" fill="#6B7280" opacity="0.6"/>
  <circle cx="162" cy="148" r="4" fill="#9CA3AF" opacity="0.6"/>
  <!-- Empty parking spots (dashed) -->
  <rect x="178" y="102" width="52" height="46" rx="4" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="5 3" fill="#F9FAFB"/>
  <text x="204" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#E4E4E7">P</text>
  <!-- "No trucks in group" badge -->
  <rect x="168" y="58" width="58" height="34" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" filter="url(#ef-shadow)"/>
  <text x="197" y="72" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">Không có xe</text>
  <text x="197" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">trong nhóm</text>
  <!-- Arrow pointing down to empty spot -->
  <line x1="197" y1="92" x2="197" y2="104" stroke="#E4E4E7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="192,104 197,112 202,104" fill="#E4E4E7"/>
  <!-- Cloud above -->
  <circle cx="50" cy="66" r="16" fill="#F3F4F6" opacity="0.7"/>
  <circle cx="66" cy="60" r="12" fill="#F3F4F6" opacity="0.7"/>
  <circle cx="78" cy="66" r="10" fill="#F3F4F6" opacity="0.7"/>
  <rect x="34" y="66" width="54" height="12" fill="#F3F4F6" opacity="0.7"/>
</svg>
