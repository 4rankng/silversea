server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets — long cache (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker script MUST revalidate on every update check: under
    # the immutable rule above, a browser could keep running a retired SW
    # (with its retired asset caches) for up to a year after a deploy — every
    # returning session would keep seeing the previous build. `updateViaCache:
    # 'none'` at registration makes the browser bypass this cache too, so an
    # already-poisoned profile still picks up the new SW on its next load and
    # the SW's own activate purges the retired caches.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback
    # The SPA entrypoint must revalidate on every load: without an explicit
    # Cache-Control, browsers heuristically cache index.html and keep serving
    # a stale bundle (referencing old hashed assets) long after a deploy —
    # users keep seeing the previous build with "fixed" bugs still broken.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
