<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialog Guideline — TransTing (Green Palette)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ================================================================
   * TransTing Dialog Guideline
   * Adapted from design reference — green palette replaces brass/gold.
   * Maps to tokens.css: --accent, --accent-2, --accent-soft, --info
   * ================================================================ */

  :root{
    --bg:#eef0f3;
    --panel-1:#ffffff;
    --panel-2:#f9fafb;
    --field-bg:#f2f3f6;
    --field-bg-focus:#ffffff;
    --border:rgba(15,23,42,.09);
    --border-soft:rgba(15,23,42,.06);

    /* Green palette — maps to tokens.css */
    --green:#10B956;
    --green-deep:#005A2D;
    --green-bright:#34D67B;
    --green-soft:rgba(16,185,86,.10);
    --teal:#2E675E;
    --teal-soft:rgba(46,103,94,.10);
    --text-1:#161a20;
    --text-2:#5b6472;
    --text-3:#8b93a0;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Manrope',sans-serif;
    color:var(--text-1);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    background-image:
      radial-gradient(circle at 50px 50px, rgba(15,23,42,.05) 1px, transparent 1px);
    background-size:26px 26px;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(680px 420px at 18% 8%, rgba(16,185,86,.10), transparent 60%),
      radial-gradient(620px 460px at 88% 92%, rgba(46,103,94,.08), transparent 60%);
    pointer-events:none;
  }

  .stage{
    width:100%;
    max-width:920px;
    position:relative;
    z-index:1;
  }

  .panel{
    position:relative;
    background:linear-gradient(160deg, var(--panel-1), var(--panel-2) 55%);
    border:1px solid var(--border);
    border-radius:10px;
    padding:40px 44px 30px;
    box-shadow:
      0 34px 70px -32px rgba(15,23,42,.22),
      0 1px 0 rgba(255,255,255,.6) inset;
    animation:rise .5s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px) scale(.985);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .corner{
    position:absolute;
    width:22px;
    height:22px;
    border:1.5px solid var(--green);
    opacity:.7;
  }
  .corner.tl{top:-1px; left:-1px; border-right:none; border-bottom:none; border-radius:10px 0 0 0;}
  .corner.tr{top:-1px; right:-1px; border-left:none; border-bottom:none; border-radius:0 10px 0 0;}
  .corner.bl{bottom:-1px; left:-1px; border-right:none; border-top:none; border-radius:0 0 0 10px;}
  .corner.br{bottom:-1px; right:-1px; border-left:none; border-top:none; border-radius:0 0 10px 0;}

  .close-btn{
    position:absolute;
    top:26px;
    right:28px;
    width:34px;
    height:34px;
    border-radius:7px;
    border:1px solid var(--border);
    background:rgba(15,23,42,.03);
    color:var(--text-2);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .close-btn:hover{ color:var(--text-1); border-color:rgba(15,23,42,.22); background:rgba(15,23,42,.06); }
  .close-btn svg{ width:15px; height:15px; }

  .panel-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    padding-right:40px;
  }

  .eyebrow{
    margin:0 0 6px;
    font-size:13px;
    color:var(--text-2);
    font-weight:500;
    letter-spacing:.01em;
  }

  h1{
    margin:0;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:32px;
    letter-spacing:-.01em;
    color:var(--text-1);
  }

  .status-chips{
    display:flex;
    gap:8px;
    margin-bottom:3px;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 12px;
    border-radius:100px;
    font-size:12.5px;
    font-weight:600;
    border:1px solid var(--border);
    color:var(--text-2);
    background:rgba(15,23,42,.02);
  }

  .chip-live{ color:var(--green-deep); border-color:rgba(16,185,86,.3); background:var(--green-soft); }
  .chip-live .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(16,185,86,.5);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(16,185,86,.4); }
    70%{ box-shadow:0 0 0 6px rgba(16,185,86,0); }
    100%{ box-shadow:0 0 0 0 rgba(16,185,86,0); }
  }

  .chip-ghost{ color:var(--teal); border-color:rgba(46,103,94,.35); background:var(--teal-soft); }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--border-soft) 12%, var(--border-soft) 88%, transparent);
    margin:26px 0;
  }

  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:26px 28px;
  }

  .field{ display:flex; flex-direction:column; gap:9px; }

  .field label{
    font-size:13px;
    font-weight:600;
    color:var(--text-2);
    display:flex;
    align-items:center;
    gap:6px;
  }

  .field.required label::after{
    content:"";
    width:4px; height:4px;
    border-radius:50%;
    background:var(--green-deep);
    margin-left:1px;
  }

  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
    background:var(--field-bg);
    border:1px solid var(--border);
    border-radius:7px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }

  .input-wrap svg{
    width:16px; height:16px;
    margin-left:14px;
    color:var(--text-3);
    flex-shrink:0;
    transition:color .15s ease;
  }

  .input-wrap input, .input-wrap textarea{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-1);
    font-family:'Manrope',sans-serif;
    font-size:15px;
    padding:12px 14px;
  }

  .input-wrap.mono input{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    font-size:14.5px;
  }

  .input-wrap input::placeholder, .input-wrap textarea::placeholder{ color:var(--text-3); }

  .input-wrap:focus-within{
    background:var(--field-bg-focus);
    border-color:var(--green);
    box-shadow:0 0 0 3px var(--green-soft);
  }
  .input-wrap:focus-within svg{ color:var(--green-deep); }

  .suffix-text{
    padding-right:14px;
    font-size:12.5px;
    color:var(--text-3);
    font-family:'Manrope',sans-serif;
    white-space:nowrap;
  }

  .textarea-wrap{ align-items:flex-start; }
  .textarea-wrap textarea{ resize:vertical; min-height:74px; line-height:1.55; padding-left:0; }
  .textarea-wrap svg{ margin-top:13px; }

  .panel-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }

  .hint{ margin:0; font-size:12.5px; color:var(--text-3); }
  .hint .req-mark{ color:var(--green-deep); }

  .actions{ display:flex; gap:10px; }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Manrope',sans-serif;
    font-size:14.5px;
    font-weight:700;
    padding:11px 20px;
    border-radius:7px;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  .btn svg{ width:15px; height:15px; }

  .btn-ghost{
    background:transparent;
    border-color:var(--border);
    color:var(--text-2);
  }
  .btn-ghost:hover{ border-color:rgba(15,23,42,.24); color:var(--text-1); background:rgba(15,23,42,.02); }

  .btn-primary{
    color:#fff;
    background:linear-gradient(180deg, var(--green-bright), var(--green));
    box-shadow:0 10px 22px -10px rgba(16,185,86,.5);
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(16,185,86,.6); }
  .btn-primary:active{ transform:translateY(0); }

  .btn-danger{
    color:#fff;
    background:linear-gradient(180deg, #c05560, #A0444E);
    box-shadow:0 10px 22px -10px rgba(160,68,78,.5);
  }
  .btn-danger:hover{ transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(160,68,78,.6); }
  .btn-danger:active{ transform:translateY(0); }

  .toast{
    position:fixed;
    left:50%;
    bottom:36px;
    transform:translate(-50%, 16px);
    display:flex;
    align-items:center;
    gap:9px;
    padding:12px 18px;
    border-radius:8px;
    background:#ffffff;
    border:1px solid rgba(16,185,86,.35);
    color:var(--text-1);
    font-size:13.5px;
    font-weight:600;
    box-shadow:0 20px 40px -18px rgba(15,23,42,.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:5;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast svg{ width:15px; height:15px; color:var(--green); flex-shrink:0; }

  @media (max-width:680px){
    .panel{ padding:30px 20px 22px; }
    .form-grid{ grid-template-columns:1fr; gap:20px; }
    h1{ font-size:26px; }
    .panel-header{ padding-right:36px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="panel">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <button class="close-btn" aria-label="Đóng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="panel-header">
      <div>
        <p class="eyebrow">Sửa nhà cung cấp</p>
        <h1>PV Oil</h1>
      </div>
      <div class="status-chips">
        <span class="chip chip-live"><span class="dot"></span>Đang hoạt động</span>
        <span class="chip chip-ghost">Dự phòng</span>
      </div>
    </div>

    <div class="divider"></div>

    <form class="form-grid">
      <div class="field required">
        <label>Tên nhà xe</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-4.5A2 2 0 0 1 6.4 3h5.2a2 2 0 0 1 1.9 1.5L15 9"/><path d="M3 9h16.5a1.5 1.5 0 0 1 1.5 1.5V16a1 1 0 0 1-1 1h-1"/><path d="M3 9v7a1 1 0 0 0 1 1h1"/><circle cx="7.5" cy="17.5" r="1.7"/><circle cx="16.5" cy="17.5" r="1.7"/></svg>
          <input type="text" value="PV Oil">
        </div>
      </div>

      <div class="field">
        <label>Tên viết tắt</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-7.5 7.5a2 2 0 0 1-2.8 0L4 14.8V6a2 2 0 0 1 2-2h8.8L20 9.2a2 2 0 0 1 0 2.8z"/><circle cx="9" cy="9" r="1"/></svg>
          <input type="text" placeholder="Để trống sẽ dùng tên đầy đủ">
        </div>
      </div>

      <div class="field">
        <label>Mã số thuế</label>
        <div class="input-wrap mono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 4v16M9 4v16M4 8h5M4 15h5M15 4l-2 16M20 4l-2 16M13 8h6M12.4 15h6"/></svg>
          <input type="text" value="0102716892" inputmode="numeric">
        </div>
      </div>

      <div class="field">
        <label>Người liên hệ</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"/></svg>
          <input type="text" value="Trần Thị Thảo">
        </div>
      </div>

      <div class="field">
        <label>Điện thoại</label>
        <div class="input-wrap mono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 2.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>
          <input type="text" value="0907654321" inputmode="numeric">
        </div>
      </div>

      <div class="field">
        <label>Hạn thanh toán Chi hộ</label>
        <div class="input-wrap mono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <input type="number" value="15">
          <span class="suffix-text">ngày</span>
        </div>
      </div>

      <div class="field">
        <label>Hạn thanh toán Cước</label>
        <div class="input-wrap mono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <input type="number" value="30">
          <span class="suffix-text">ngày</span>
        </div>
      </div>

      <div class="field">
        <label>Ghi chú</label>
        <div class="input-wrap textarea-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
          <textarea rows="3">Nhà cung cấp xăng dầu dự phòng</textarea>
        </div>
      </div>
    </form>

    <div class="divider"></div>

    <div class="panel-footer">
      <p class="hint"><span class="req-mark">*</span> Trường bắt buộc</p>
      <div class="actions">
        <button class="btn btn-ghost" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          Hủy
        </button>
        <button class="btn btn-primary" type="button" id="saveBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v5h7V4M7 13h10v7H7z"/></svg>
          Cập nhật
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  Đã cập nhật nhà cung cấp
</div>

<script>
  const saveBtn = document.getElementById('saveBtn');
  const toast = document.getElementById('toast');
  let toastTimer;
  saveBtn.addEventListener('click', () => {
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  });
</script>

</body>
</html>
